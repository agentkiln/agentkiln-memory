services:
  memory-api:
    build: .
    image: agentkiln-memory:1.0.0
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AML_DATABASE_PATH: /data/memory.db
      AML_PRODUCTION: "1"
      AML_LLM_MODE: ${AML_LLM_MODE:-competition}
      AML_API_KEY: ${AML_API_KEY:?set AML_API_KEY in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in .env}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-v4}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      AML_MAX_OUTPUT_TOKENS: ${AML_MAX_OUTPUT_TOKENS:-8000}
      AML_MAX_OUTPUT_ITEMS: ${AML_MAX_OUTPUT_ITEMS:-24}
      AML_VECTOR_MIN_SIMILARITY: ${AML_VECTOR_MIN_SIMILARITY:-0.35}
      AML_VECTOR_ONLY_MIN_SIMILARITY: ${AML_VECTOR_ONLY_MIN_SIMILARITY:-0.65}
      AML_SEARCH_CONCURRENCY: ${AML_SEARCH_CONCURRENCY:-32}
      AML_ADD_CONCURRENCY: ${AML_ADD_CONCURRENCY:-16}
    volumes:
      - agentkiln-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g

volumes:
  agentkiln-data:
